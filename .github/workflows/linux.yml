name: Compilar Dylan para Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta existente para compilar y preparar su borrador
        required: false
        type: string

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.release_ref.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Seleccionar la etiqueta del release
        id: release_ref
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${REQUESTED_TAG}"
          fi
          if [[ -n "$tag" ]]; then
            if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+|1\.0\.0-beta\.[1-9][0-9]*)$ ]]; then
              echo "Etiqueta no admitida: $tag" >&2
              exit 1
            fi
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release_ref.outputs.ref }}
      - name: Registrar el commit compilado
        id: source
        shell: bash
        run: |
          set -euo pipefail
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar dependencias de GPUI Kit para Linux
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libfontconfig1-dev libfreetype-dev libvulkan-dev
      - name: Validar versión y etiqueta
        id: version
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release_ref.outputs.tag }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; m=json.load(sys.stdin); print(next(p["version"] for p in m["packages"] if p["name"]=="dylan"))')"
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+|1\.0\.0-beta\.[1-9][0-9]*)$ ]]; then
            echo "Versión inválida: $version" >&2
            exit 1
          fi
          if [[ -n "${RELEASE_TAG}" && "${RELEASE_TAG}" != "v${version}" ]]; then
            echo "La etiqueta debe ser v${version}" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Comprobar Dylan
        run: cargo check --locked --workspace
      - name: Ejecutar Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Ejecutar pruebas
        run: cargo test --locked --workspace
      - name: Compilar Dylan
        run: cargo build --locked --release -p dylan
      - name: Descargar el ejecutable oficial de Veltrix para Linux
        shell: bash
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import json; print(json.load(open("apps/desktop/installer/veltrix-release.json"))["tag"])')"
          mkdir -p target/veltrix-release
          curl -fsSL "https://github.com/paintdev16/veltrix/releases/download/${tag}/veltrix-linux-x86_64" \
            -o target/veltrix-release/veltrix-linux-x86_64
          chmod 0755 target/veltrix-release/veltrix-linux-x86_64
      - name: Empaquetar actualización e instalador Linux
        shell: bash
        run: |
          set -euo pipefail
          bash apps/desktop/installer/package-linux.sh \
            --dylan target/release/dylan \
            --veltrix target/veltrix-release/veltrix-linux-x86_64 \
            --output target/linux-ci
      - name: Probar script de instalación inicial Linux
        shell: bash
        env:
          DYLAN_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tmp_home="$(mktemp -d)"
          stage="$(mktemp -d)"
          tar -xzf "target/linux-ci/Dylan-Installer-${DYLAN_VERSION}-linux-x86_64.tar.gz" -C "$stage"
          HOME="$tmp_home" XDG_DATA_HOME="$tmp_home/.local/share" bash "$stage/install.sh"
          if [[ "$DYLAN_VERSION" == *-* ]]; then
            installed="$tmp_home/.local/share/dylan-beta"
          else
            installed="$tmp_home/.local/share/dylan"
          fi
          test -x "$installed/dylan"
          test -f "$installed/version.txt"
          test -x "$installed/.updater/veltrix"
          test -f "$installed/.updater/app.json"
          test -f "$installed/.updater/update.lock"
          test "$("$installed/dylan" --version)" = "$DYLAN_VERSION"
          rm -rf "$tmp_home" "$stage"
      - name: Guardar archivos Linux para revisión y firma
        uses: actions/upload-artifact@v6
        with:
          name: Dylan-${{ steps.version.outputs.version }}-linux-sin-firmar
          path: |
            target/linux-ci/Dylan-Update-*-linux-x86_64.tar.gz
            target/linux-ci/Dylan-Installer-*-linux-x86_64.tar.gz
            target/linux-ci/update-linux-x86_64.json
            target/linux-ci/inputs/dylan
          if-no-files-found: error

  draft:
    name: Firmar y adjuntar paquete Linux al release en borrador
    needs: linux
    if: needs.linux.outputs.tag != '' && github.repository == 'paintdev16/dylan-comedor-frontend-desktop'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: dylan-draft-${{ needs.linux.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Consultar si ya existe un release para la etiqueta
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.linux.outputs.tag }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/releases"
          while IFS=$'\t' read -r tag draft id url; do
            if [[ "$tag" == "$RELEASE_TAG" ]]; then
              if [[ "$draft" == "true" ]]; then
                echo "Borrador existente $tag (ID $id)" >> "$GITHUB_STEP_SUMMARY"
                echo "draft_id=$id" >> "$GITHUB_OUTPUT"
              else
                echo "Release ya publicado $tag (ID $id)" >> "$GITHUB_STEP_SUMMARY"
                echo "published=true" >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
          done < <(gh api --paginate "${api}?per_page=100" --jq '.[] | [.tag_name, .draft, .id, .html_url] | @tsv')
      - uses: actions/checkout@v6
        if: steps.release.outputs.published != 'true'
        with:
          ref: ${{ needs.linux.outputs.commit }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.published != 'true'
      - name: Instalar dependencias de compilación para verify-release
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libwayland-dev libfontconfig1-dev libfreetype-dev libvulkan-dev
      - uses: actions/download-artifact@v8
        if: steps.release.outputs.published != 'true'
        with:
          name: Dylan-${{ needs.linux.outputs.version }}-linux-sin-firmar
          path: target/signed-release
      - name: Compilar el firmador de Veltrix
        if: steps.release.outputs.published != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked --git https://github.com/paintdev16/veltrix.git --tag v0.1.7 --root target/veltrix-tools veltrix-sign
      - name: Firmar el manifiesto Linux Ed25519 y verificar
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          DYLAN_SIGNING_KEY: ${{ secrets.DYLAN_SIGNING_KEY }}
          DYLAN_VERSION: ${{ needs.linux.outputs.version }}
        run: |
          set -euo pipefail
          key_hex="${DYLAN_SIGNING_KEY//[[:space:]]/}"
          unset DYLAN_SIGNING_KEY
          if [[ ! "$key_hex" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "DYLAN_SIGNING_KEY debe contener la semilla de Dylan en 64 caracteres hexadecimales" >&2
            exit 1
          fi
          key_path="$(mktemp "${RUNNER_TEMP}/dylan-XXXXXX.key")"
          trap 'rm -f "$key_path"' EXIT
          python3 -c 'import sys; open(sys.argv[2], "wb").write(bytes.fromhex(sys.argv[1]))' "$key_hex" "$key_path"
          unset key_hex

          manifest="target/signed-release/update-linux-x86_64.json"
          pkg="target/signed-release/Dylan-Update-${DYLAN_VERSION}-linux-x86_64.tar.gz"
          sig="${manifest}.sig"
          output="$(target/veltrix-tools/bin/veltrix-sign "$key_path" "$manifest" "$pkg" "$sig" 2>&1)"
          echo "$output"
          rm -f "$key_path"

          if [[ "$DYLAN_VERSION" == *-* ]]; then
            cfg="apps/desktop/installer/app-linux.json"
          else
            cfg="apps/desktop/installer/app-linux-stable.json"
          fi
          expected_pub="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["public_key"].lower())' "$cfg")"
          actual_pub="$(printf '%s\n' "$output" | sed -n 's/^Public key: \([0-9a-fA-F]\{64\}\)$/\1/p' | tr '[:upper:]' '[:lower:]')"
          if [[ "$actual_pub" != "$expected_pub" ]]; then
            echo "La clave privada no corresponde a la clave pública de Dylan" >&2
            exit 1
          fi

          cargo run --locked -p dylan --bin verify-release -- target/signed-release
      - name: Adjuntar assets Linux al borrador del release
        if: steps.release.outputs.published != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.linux.outputs.tag }}
          DYLAN_VERSION: ${{ needs.linux.outputs.version }}
          DRAFT_ID: ${{ steps.release.outputs.draft_id }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/releases"
          draft_id="${DRAFT_ID}"
          if [[ -z "$draft_id" ]]; then
            prerelease=false
            if [[ "$DYLAN_VERSION" == *-* ]]; then prerelease=true; fi
            draft_id="$(gh api "$api" --method POST \
              -f tag_name="$RELEASE_TAG" \
              -f name="Dylan $RELEASE_TAG" \
              -F draft=true \
              -F prerelease="$prerelease" \
              -F generate_release_notes=true \
              -f make_latest=false \
              --jq '.id')"
          fi
          echo "Adjuntando assets Linux al borrador $RELEASE_TAG (ID $draft_id)"
          for file in \
            "target/signed-release/Dylan-Update-${DYLAN_VERSION}-linux-x86_64.tar.gz" \
            "target/signed-release/Dylan-Installer-${DYLAN_VERSION}-linux-x86_64.tar.gz" \
            "target/signed-release/update-linux-x86_64.json" \
            "target/signed-release/update-linux-x86_64.json.sig"; do
            name="$(basename "$file")"
            existing_asset_id="$(gh api "${api}/${draft_id}/assets?per_page=100" --jq ".[] | select(.name == \"${name}\") | .id" | head -n1)"
            if [[ -n "$existing_asset_id" ]]; then
              gh api "${api}/assets/${existing_asset_id}" --method DELETE
            fi
            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${draft_id}/assets?name=${name}" > /dev/null
          done
          url="$(gh api "${api}/${draft_id}" --jq '.html_url')"
          echo "Assets Linux adjuntados en: $url" >> "$GITHUB_STEP_SUMMARY"
