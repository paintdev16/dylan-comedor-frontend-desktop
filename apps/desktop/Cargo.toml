
[package]
name = "dylan"
default-run = "dylan"
version.workspace = true
edition.workspace = true
authors = ["Paint"]
description = "Sistema de gestión del comedor Dylan"

[package.metadata.wix]
eula = false

[dependencies]
shared = { path = "../../crates/shared" }
gpui-kit = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tempfile = "3"
veltrix-core = { git = "https://github.com/paintdev16/veltrix.git", tag = "v0.1.4", version = "0.1.0" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
